site_name: F5 Cloud Status MCP Server
site_description: MCP server for F5 Distributed Cloud service status monitoring
site_url: https://robinmordasiewicz.github.io/f5xc-cloudstatus-mcp/
repo_name: robinmordasiewicz/f5xc-cloudstatus-mcp
repo_url: https://github.com/robinmordasiewicz/f5xc-cloudstatus-mcp

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - header.autohide
  icon:
    repo: fontawesome/brands/github
    logo: material/console

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/robinmordasiewicz/f5xc-cloudstatus-mcp
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sidebar-fix.js

nav:
  - Home: index.md
  - Platform Guides:
    - Claude Code: installation/claude-code.md
    - OpenCode: installation/opencode.md
    - VS Code: installation/vscode.md
    - Claude Desktop: installation/claude-desktop.md
    - Troubleshooting: installation/troubleshooting.md
